<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Complete Daily Study Tracker</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- html2pdf.js for exporting single page PDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
        
        /* Strict A4 Single Page Ratio for Export */
        .a4-page {
            width: 210mm;
            height: 297mm;
            padding: 12mm 15mm;
            background: white;
            box-shadow: 0 10px 25px -5px rgba(0,0,0,0.1);
            margin: 0 auto;
            color: #1e293b;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-sizing: border-box;
            overflow: hidden;
        }

        .checkbox-custom {
            width: 15px;
            height: 15px;
            border: 1.5px solid #64748b;
            border-radius: 3px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            background-color: white;
        }
        .checkbox-custom.checked {
            background-color: #2563eb;
            border-color: #2563eb;
        }
        .checkbox-custom.checked::after {
            content: '✓';
            color: white;
            font-size: 10px;
            font-weight: bold;
        }

        @media print {
            .no-print { display: none !important; }
            body { background: white; padding: 0; }
            .a4-page { box-shadow: none; margin: 0; padding: 10mm; width: 100%; height: 100vh; }
        }
    </style>
</head>
<body class="bg-slate-100 min-h-screen py-6 px-4">

    <div class="max-w-7xl mx-auto grid grid-cols-1 lg:grid-cols-12 gap-6">
        
        <!-- CONTROL PANEL (LEFT) -->
        <div class="lg:col-span-5 bg-white rounded-2xl shadow-md p-5 space-y-4 no-print max-h-[92vh] overflow-y-auto">
            <div class="border-b pb-2">
                <h1 class="text-xl font-bold text-slate-800">Daily Study Planner</h1>
                <p class="text-xs text-slate-500">Track lectures, notes/DPP matrix, custom PYQs & test scores for your mentor.</p>
            </div>

            <!-- Date Input -->
            <div>
                <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1">Date</label>
                <input type="date" id="inputDate" class="w-full px-3 py-1.5 border rounded-lg text-xs focus:ring-2 focus:ring-blue-500">
            </div>

            <!-- 1. Class Tracker Controls -->
            <div>
                <div class="flex justify-between items-center mb-1.5">
                    <label class="text-xs font-bold uppercase tracking-wider text-slate-600">Class Tracker</label>
                    <button onclick="addClassRow()" class="text-[11px] bg-blue-50 text-blue-600 font-semibold px-2 py-0.5 rounded hover:bg-blue-100">+ Add Class</button>
                </div>
                <div id="classInputs" class="space-y-1.5"></div>
            </div>

            <!-- 2. Subject Matrix Controls (Notes, HW/DPP, Rev) -->
            <div>
                <div class="flex justify-between items-center mb-1.5">
                    <label class="text-xs font-bold uppercase tracking-wider text-slate-600">Subject Matrix (Notes / DPP / Rev)</label>
                    <button onclick="addMatrixRow()" class="text-[11px] bg-blue-50 text-blue-600 font-semibold px-2 py-0.5 rounded hover:bg-blue-100">+ Add Subject</button>
                </div>
                <div id="matrixInputs" class="space-y-1.5"></div>
            </div>

            <!-- 3. Manual Custom Tasks (PYQs, Formula Rev, etc.) -->
            <div>
                <div class="flex justify-between items-center mb-1.5">
                    <label class="text-xs font-bold uppercase tracking-wider text-slate-600">Manual / Extra Tasks (PYQs)</label>
                    <button onclick="addCustomTask()" class="text-[11px] bg-emerald-50 text-emerald-600 font-semibold px-2 py-0.5 rounded hover:bg-emerald-100">+ Add Task</button>
                </div>
                <div id="customTaskInputs" class="space-y-1.5"></div>
            </div>

            <!-- 4. Test Section Toggle & Inputs -->
            <div class="p-2.5 bg-slate-50 rounded-xl border border-slate-200">
                <div class="flex items-center justify-between">
                    <label class="text-xs font-bold uppercase tracking-wider text-slate-700">Any Tests Today?</label>
                    <div class="flex gap-3 text-xs">
                        <label class="inline-flex items-center"><input type="radio" name="hasTest" value="yes" onchange="toggleTestSection(true)" class="mr-1"> Yes</label>
                        <label class="inline-flex items-center"><input type="radio" name="hasTest" value="no" onchange="toggleTestSection(false)" checked class="mr-1"> No</label>
                    </div>
                </div>

                <div id="testFields" class="mt-2 space-y-1.5 hidden">
                    <input type="text" id="testName" placeholder="Test Name (e.g. JEE Main Mock 3)" oninput="updateState()" class="w-full text-xs px-2 py-1 border rounded">
                    <div class="grid grid-cols-2 gap-2">
                        <input type="text" id="testScore" placeholder="Score (e.g. 180/300)" oninput="updateState()" class="text-xs px-2 py-1 border rounded">
                        <input type="text" id="testAccuracy" placeholder="Accuracy (e.g. 85%)" oninput="updateState()" class="text-xs px-2 py-1 border rounded">
                    </div>
                </div>
            </div>

            <!-- 5. Self Reflection Inputs -->
            <div class="space-y-2">
                <div>
                    <label class="block text-xs font-semibold text-slate-600">1 Mistake I Must Not Repeat</label>
                    <input type="text" id="mistakeInput" placeholder="e.g. Calculation error in Integration" oninput="updateState()" class="w-full text-xs px-2 py-1 border rounded">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600">Today I Improved At</label>
                    <input type="text" id="improvementInput" placeholder="e.g. Solved 30 Organic PYQs faster" oninput="updateState()" class="w-full text-xs px-2 py-1 border rounded">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600">Notes / Remarks for Mentor</label>
                    <textarea id="notesInput" rows="1.5" placeholder="Write any query or note for your mentor..." oninput="updateState()" class="w-full text-xs px-2 py-1 border rounded"></textarea>
                </div>
            </div>

            <!-- Share Buttons -->
            <div class="pt-2 flex gap-3">
                <button onclick="downloadPDF()" class="flex-1 bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2 rounded-xl text-xs shadow transition flex items-center justify-center gap-2">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/></svg>
                    Share PDF to Mentor
                </button>
            </div>
        </div>
