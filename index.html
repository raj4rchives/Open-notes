<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-light">

  <nav class="navbar navbar-expand-lg navbar-light bg-white border-bottom shadow-sm">
    <div class="container">
      <a class="navbar-brand" href="/">
        <img src="https://storage.perfectcdn.com/hglpvb/04iuf68xpnh3yppi.png" alt="ADMIN PANEL" height="40">
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link active fw-bold text-primary" href="/">Sign in</a></li>
          <li class="nav-item"><a class="nav-link text-secondary" href="/services">Services</a></li>
          <li class="nav-item"><a class="nav-link text-secondary" href="/signup">Sign up</a></li>
          <li class="nav-item"><a class="nav-link text-secondary" href="/blog">Read Blog</a></li>
          <li class="nav-item"><a class="nav-link text-secondary" href="/api">API</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <section class="bg-white py-5 position-relative">
    <div class="container">
      
      <div class="row justify-content-center text-center mb-4">
        <div class="col-lg-8">
          <h1 class="h3 fw-bold text-dark">

            
          </h1>
          <h2 class="h5 text-primary fw-semibold">

            
          </h2>
          <p class="text-muted mt-3">




            
          </p>
        </div>
      </div>

      <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
          <div class="card border-0 shadow-lg rounded-3">
            <div class="card-body p-4 p-sm-5">
              
              <form method="post" action="/">
                
                <div class="mb-3">
                  <label for="username" class="form-label fw-semibold">Username</label>
                  <input type="text" class="form-control py-2" id="username" name="LoginForm[username]" placeholder="Enter your username" required>
                </div>

                <div class="mb-3">
                  <label for="password" class="form-label fw-semibold">Password</label>
                  <input type="password" class="form-control py-2" id="password" name="LoginForm[password]" placeholder="Enter your password" required>
                </div>

                <div class="d-flex justify-content-end mb-3">
                  <a href="/resetpassword" class="text-decoration-none small text-primary">Forgot password?</a>
                </div>

                <div class="mb-3">
                  <button type="submit" class="btn btn-primary w-100 py-2 fw-bold">Sign in</button>
                </div>

                <div class="text-center mt-4">
                  <span class="text-muted small">Do not have an account?</span>
                  <a href="/signup" class="fw-bold text-decoration-none small ms-1">Sign up</a>
                </div>

              </form>

            </div>
          </div>
        </div>
      </div>

    </div>
  </section>

  <section class="py-5 bg-light">
    <div class="container">
      <div class="row text-center justify-content-center">
        <div class="col-lg-8">
          <h3 class="fw-bold text-dark text-decoration-underline mb-3">

            
          </h3>
          <p class="text-secondary leading-relaxed">
            Secure your admin panel is your responsibility.
          </p>
        </div>
      </div>
    </div>
  </section>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
